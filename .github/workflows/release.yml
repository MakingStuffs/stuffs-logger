# The release pipeline.
#
# semantic-release reads the conventional commits since the last tag, computes
# the next version, writes it into all four manifests, builds and audits
# `@stuffs-logger/core` and `@stuffs-logger/sdk`, commits the changelog and
# the version bump back to the branch, tags it, publishes both packages to
# public npm, and cuts a GitHub Release. The order — build and audit BEFORE
# the tag, publish after — is set in release.config.mjs and is what stops a
# failed publish leaving a tag npm never received.
#
# CHANNELS (from release.config.mjs, not from this file):
#   main    -> x.y.z        npm dist-tag `latest`   git tag vX.Y.Z
#   *-rc    -> x.y.z-rc.N   npm dist-tag `rc`       git tag vX.Y.Z-rc.N
name: Release

on:
  push:
    branches:
      - main
      # The same glob semantic-release resolves via `git ls-remote`. A
      # local-only `-rc` branch yields ERELEASEBRANCHES; push it first.
      - "*-rc"

# Read-only by default; the release job widens it to exactly what
# semantic-release's plugin chain uses and nothing more.
permissions:
  contents: read

concurrency:
  # NEVER cancelled mid-flight. A run interrupted between `pnpm publish` and
  # the git tag leaves a version on npm that this repository has no record of,
  # and npm versions cannot be replaced. Queueing is the only safe behaviour.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A RELEASE IS NEVER PUBLISHED FROM AN UNVERIFIED TREE. This is the same
  # reusable workflow `ci.yml` runs on the pull request — format, lint, types,
  # unit tests, build, tarball audit, and the full end-to-end and smoke suites
  # against a real Postgres. Calling the same file rather than repeating its
  # steps is what stops the two from drifting apart.
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest

    # THE ONE CONTROL THAT DECIDES WHO MAY PUBLISH.
    #
    # This job is triggered by a push to `main` or to any branch matching
    # `*-rc`, and it holds publish rights to the whole `@stuffs-logger`
    # scope — a granular npm token today, an OIDC trust relationship once
    # trusted publishing is configured. Without an environment, that makes
    # "publish to the public registry" reachable by anyone with repository
    # WRITE access — a strictly lower privilege — by pushing a branch named
    # `anything-rc`. `needs: verify` is not a control against that actor: the
    # same push supplies the code and the tests that verify it.
    #
    # Naming an environment here binds the credential to a resource a
    # maintainer can gate. THE GATING IS REPOSITORY CONFIGURATION, NOT THIS
    # FILE, and until it is done this key changes nothing — docs/CI-CD.md
    # ("Before the first release") states exactly what must be set: required
    # reviewers, the deployment-branch restriction, `NPM_TOKEN` moved to an
    # ENVIRONMENT secret, and a ruleset restricting who may create `*-rc`
    # branches.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@stuffs-logger/sdk

    # Exactly the scopes semantic-release's plugin chain needs:
    permissions:
      contents: write # the version commit, the git tag, the GitHub Release
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # ...and on released pull requests
      # The OIDC token npm signs the provenance attestation with — and, once
      # trusted publishing is configured on npmjs.com, the token npm exchanges
      # for publish rights, replacing NPM_TOKEN entirely. Provenance is what
      # makes a stolen NPM_TOKEN detectable rather than silent: a version
      # published from anywhere other than this workflow, on this repository,
      # at this ref carries no attestation and npm says so on the package
      # page. `release.config.mjs` passes `--provenance` to the publish.
      id-token: write

    env:
      # NO REINSTALL BEHIND THE INSTALL STEP'S BACK. pnpm 11 defaults
      # `verifyDepsBeforeRun` to `install`: before every `pnpm run` and
      # `pnpm exec` it compares `node_modules` with the lockfile, the
      # workspace settings and each workspace package's name AND VERSION, and
      # when they differ it runs a plain `pnpm install` first — unfiltered,
      # with install scripts. `sync-versions.mjs` rewrites all four versions
      # in semantic-release's prepare step, so without this the build that
      # follows it would silently reinstall the whole workspace, scripts and
      # dashboard included, beside the npm credential. (Verified against pnpm
      # 11.22.0: the `pnpm_config_` spelling is the one it honours; the
      # `npm_config_` spelling is not.) The Install step below is the only
      # install this job performs.
      pnpm_config_verify_deps_before_run: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads the whole commit history to work out what
          # changed since the last tag. A shallow clone makes it compute the
          # wrong version, silently.
          fetch-depth: 0
          # NO CREDENTIAL IN `.git/config`. semantic-release does not use the
          # one `actions/checkout` would persist: it builds its own push URL,
          # `https://x-access-token:<GITHUB_TOKEN>@github.com/…`, from the
          # `GITHUB_TOKEN` the Release step is given (see
          # `semantic-release/lib/get-git-auth-url.js`). Persisting the
          # checkout's copy only put a write-scoped token on disk where every
          # build script and dependency in this job could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not 22: `semantic-release@25` declares
          # `engines.node: "^22.14.0 || >= 24.10.0"`, which the repository's
          # own `>=22` is looser than.
          node-version: "24"
          cache: pnpm
          # Writes a runner-level `.npmrc` (under $RUNNER_TEMP, not in the
          # checkout) that makes `pnpm whoami` and `pnpm publish` read
          # NODE_AUTH_TOKEN. Without it the publish step is anonymous.
          registry-url: https://registry.npmjs.org

      # ONLY WHAT THE RELEASE NEEDS, AND NO INSTALL SCRIPTS.
      #
      # This job holds the npm credential, so the dependency tree it installs
      # is the dependency tree that credential is exposed to. The release
      # touches three workspace projects — the root (semantic-release and its
      # plugins), the core and the SDK (tsup, to build the tarballs) — and
      # nothing in it needs the dashboard's Next.js, Prisma or Playwright
      # trees, so those are not installed here at all.
      #
      # `--ignore-scripts` means no dependency's install hook runs beside the
      # token either. The build needs only `esbuild`, whose binary resolves
      # through its platform package (`@esbuild/linux-x64`) without its
      # postinstall; `verify.yml`'s `build` job already proved the same build
      # with scripts enabled, so nothing is being skipped that mattered.
      - name: Install the release toolchain
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter stuffs-logger
          --filter @stuffs-logger/core
          --filter @stuffs-logger/sdk

      - name: Release
        # The whole pipeline, exactly as `release.config.mjs` defines it.
        # cosmiconfig discovers that file at the repository root, so there is
        # no `--extends` or `-c` flag to keep in step with it.
        run: pnpm release
        env:
          # Creates the GitHub Release, comments on released issues and pull
          # requests, and authenticates the version commit's push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The npm credential. A GRANULAR access token scoped to the
          # `@stuffs-logger/*` packages with "bypass 2FA", which EXPIRES —
          # docs/CI-CD.md records the date and the renewal steps — or nothing
          # at all once trusted publishing is configured on npmjs.com, when
          # this line is deleted and the OIDC token above takes its place.
          #
          # THE ONLY PLACE THIS SECRET APPEARS. It is scoped to this one step,
          # never echoed, never written to a file this workflow keeps, and
          # never present in any job that uploads an artifact. It is exercised
          # by `pnpm whoami` in semantic-release's verifyConditions step, so an
          # expired token fails the run before anything is tagged.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The identity on the version commit and the tag. Without these
          # semantic-release signs them as `semantic-release-bot
          # <semantic-release-bot@martynus.net>` — the tool's own placeholder,
          # which is not an identity this repository has any relationship
          # with. `41898282+github-actions[bot]` is the account GitHub
          # attributes Actions' own pushes to, the same one `ci.yml`'s
          # auto-format commit uses.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  # Checks the deployment after a release, when there is one to check.
  #
  # Deploying the dashboard is deliberately outside this repository's
  # automation (see docs/DEPLOYMENT.md), so this runs only if a maintainer has
  # set the `SMOKE_BASE_URL` repository VARIABLE — not a secret, because a
  # public origin is not one — naming the environment to check.
  smoke:
    name: Smoke
    needs: release
    if: vars.SMOKE_BASE_URL != ''
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ vars.SMOKE_BASE_URL }}
