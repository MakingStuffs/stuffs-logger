# The release pipeline.
#
# `scripts/release.sh` reads the conventional commits since the last stable
# tag, computes the next version, writes it into all four manifests, builds
# and audits `@stuffs/logger-core` and `@stuffs/logger`, commits the
# changelog and the version bump back to the branch, tags it, publishes both
# packages to public npm, and cuts a GitHub Release. The order — build and
# audit BEFORE the tag, publish after — is set in that script and is what
# stops a failed publish leaving a tag npm never received.
#
# CHANNELS (from scripts/release.sh, not from this file):
#   main    -> x.y.z        npm dist-tag `latest`   git tag vX.Y.Z
#   *-rc    -> x.y.z-rc.N   npm dist-tag `rc`       git tag vX.Y.Z-rc.N
name: Release

on:
  push:
    branches:
      - main
      # Prereleases: `x.y.z-rc.N` on the `rc` dist-tag.
      - "*-rc"

# Read-only by default; the release job widens it to exactly what the
# release script uses and nothing more.
permissions:
  contents: read

concurrency:
  # NEVER cancelled mid-flight. A run interrupted between `pnpm publish` and
  # the git tag leaves a version on npm that this repository has no record of,
  # and npm versions cannot be replaced. Queueing is the only safe behaviour.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A RELEASE IS NEVER PUBLISHED FROM AN UNVERIFIED TREE. This is the same
  # reusable workflow `ci.yml` runs on the pull request — format, lint, types,
  # unit tests, build, tarball audit, and the full end-to-end and smoke suites
  # against a real Postgres. Calling the same file rather than repeating its
  # steps is what stops the two from drifting apart.
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest

    # THE ONE CONTROL THAT DECIDES WHO MAY PUBLISH.
    #
    # This job is triggered by a push to `main` or to any branch matching
    # `*-rc`, and it holds publish rights to both published packages through
    # npm trusted publishing — no token, an OIDC trust relationship naming
    # this repository, this workflow file and this environment. Without
    # environment protection, that makes
    # "publish to the public registry" reachable by anyone with repository
    # WRITE access — a strictly lower privilege — by pushing a branch named
    # `anything-rc`. `needs: verify` is not a control against that actor: the
    # same push supplies the code and the tests that verify it.
    #
    # Naming an environment here binds the credential to a resource a
    # maintainer can gate. THE GATING IS REPOSITORY CONFIGURATION, NOT THIS
    # FILE, and until it is done this key changes nothing — docs/CI-CD.md
    # ("Before the first release") states exactly what must be set: required
    # reviewers, the deployment-branch restriction, and a ruleset restricting
    # who may create `*-rc` branches.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@stuffs/logger

    # Exactly the scopes the release script needs:
    permissions:
      contents: write # the version commit, the git tag, the GitHub Release
      # THE NPM CREDENTIAL. npm exchanges the job's OIDC identity for a
      # short-lived publish token (trusted publishing), and the provenance
      # attestation is signed with it. There is no npm token anywhere:
      # nothing to leak, rotate or let expire.
      id-token: write

    env:
      # NO REINSTALL BEHIND THE INSTALL STEP'S BACK. pnpm 11 defaults
      # `verifyDepsBeforeRun` to `install`: before every `pnpm run` and
      # `pnpm exec` it compares `node_modules` with the lockfile, the
      # workspace settings and each workspace package's name AND VERSION, and
      # when they differ it runs a plain `pnpm install` first — unfiltered,
      # with install scripts. `sync-versions.mjs` rewrites all four versions
      # partway through `scripts/release.sh`, so without this the build that
      # follows it would silently reinstall the whole workspace, scripts and
      # dashboard included, beside the npm credential. (Verified against pnpm
      # 11.22.0: the `pnpm_config_` spelling is the one it honours; the
      # `npm_config_` spelling is not.) The Install step below is the only
      # install this job performs.
      pnpm_config_verify_deps_before_run: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release reads every commit and tag since the last stable
          # tag. A shallow clone has neither, and the script refuses to run
          # without a baseline tag rather than guessing one.
          fetch-depth: 0
          # NO CREDENTIAL IN `.git/config`. `scripts/release.sh` passes the
          # Release step's `GITHUB_TOKEN` to its one `git push` as a
          # per-command header instead. Persisting the checkout's copy would
          # only put a write-scoped token on disk where every build script
          # and dependency in this job could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The same major `verify.yml` tests on.
          node-version: "24"
          cache: pnpm
          # NO `registry-url`. It writes a runner-level npm config holding
          # `_authToken=${NODE_AUTH_TOKEN}` — and with no token set,
          # setup-node fills in a placeholder. There is no token here: npm
          # trusted publishing authenticates the publish through OIDC, and a
          # placeholder token in the config is something for it to trip on.

      # ONLY WHAT THE RELEASE NEEDS, AND NO INSTALL SCRIPTS.
      #
      # This job holds the npm credential, so the dependency tree it installs
      # is the dependency tree that credential is exposed to. The release
      # builds two workspace projects — the core and the SDK, with their own
      # tsup — and the script itself needs only bash, git, node and `gh`, all
      # on the runner already. Nothing in it needs the root's tooling or the
      # dashboard's Next.js, Prisma or Playwright trees, so those are not
      # installed here at all.
      #
      # `--ignore-scripts` means no dependency's install hook runs beside the
      # token either. The build needs only `esbuild`, whose binary resolves
      # through its platform package (`@esbuild/linux-x64`) without its
      # postinstall; `verify.yml`'s `build` job already proved the same build
      # with scripts enabled, so nothing is being skipped that mattered.
      - name: Install the release toolchain
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter @stuffs/logger-core
          --filter @stuffs/logger

      - name: Release
        # The whole pipeline, in `scripts/release.sh`. Run with `bash`
        # directly rather than `pnpm release`: no root install is needed for
        # a script that has no dependencies.
        run: bash scripts/release.sh
        env:
          # Authenticates the version commit's push and, through `gh`,
          # creates the GitHub Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: the publish authenticates through `id-token: write`
          # (npm trusted publishing), and the script proves npm accepts it for
          # both packages before anything is tagged.
          # The identity on the version commit and the tag; the runner has
          # none configured, so without these the commit fails.
          # `41898282+github-actions[bot]` is the account GitHub
          # attributes Actions' own pushes to, the same one `ci.yml`'s
          # auto-format commit uses.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  # Checks the deployment after a release, when there is one to check.
  #
  # Deploying the dashboard is deliberately outside this repository's
  # automation (see docs/DEPLOYMENT.md), so this runs only if a maintainer has
  # set the `SMOKE_BASE_URL` repository VARIABLE — not a secret, because a
  # public origin is not one — naming the environment to check.
  smoke:
    name: Smoke
    needs: release
    if: vars.SMOKE_BASE_URL != ''
    uses: ./.github/workflows/smoke.yml
    with:
      base_url: ${{ vars.SMOKE_BASE_URL }}
